[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envguard"
version = "0.1.0"
description = "A CLI tool for auditing .env files and scanning git history for leaked secrets"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["envguard*"]

[project.scripts]
envguard = "envguard.main:main"
